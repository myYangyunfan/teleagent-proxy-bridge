[package]
name = "teleproxybridge-setup"
version = "1.0.0"
description = "TeleProxyBridge native setup"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Build scripts must NOT inherit "strip"/LTO: on this machine Kaspersky refuses to
# execute freshly linked, stripped build-script binaries (os error 5, "never executed").
[profile.release.build-override]
opt-level = 0
strip = false
debug = false
